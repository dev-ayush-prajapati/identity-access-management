name: CI

on:
  push:
  pull_request:

jobs:
  portal:
    name: portal (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json

      - run: npm ci

      # Gitignored, no postinstall hook — a fresh checkout doesn't typecheck
      # or build until this runs. Doesn't need a live database. Uses the
      # local binary, not `npx prisma` — npx has been observed silently
      # fetching a newer major (8.x, incompatible CLI) instead of resolving
      # the pinned ^7.9.0 devDependency.
      - run: ./node_modules/.bin/prisma generate

      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  finance-app:
    name: finance-app (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/finance-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/finance-app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
